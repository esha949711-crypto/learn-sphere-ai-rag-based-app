
name: LearnSphere AI app

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Project Dependencies
        run: pip install -r requirements.txt

      - name: Check Python Syntax
        run: python -m compileall -q .

      - name: Verify Flask
        run: python -c "import flask; print('Flask installed successfully')"

      - name: Verify Application
        run: python -c "import app; print('LearnSphere AI application imported successfully')"

      - name: Workflow Completed
        run: echo "LearnSphere AI build and test completed successfully!"
