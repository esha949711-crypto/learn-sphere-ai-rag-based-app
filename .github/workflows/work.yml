
name: LearnSphere AI - Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Project Files
        run: |
          echo "Checking repository files..."
          ls -la

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found in repository root."
            exit 1
          fi

          if [ ! -f app.py ]; then
            echo "ERROR: app.py not found in repository root."
            exit 1
          fi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python Syntax
        run: python -m compileall -q .

      - name: Verify Flask
        run: python -c "import flask; print('Flask installed successfully')"

      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK secret is missing."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK"

      - name: Deployment Completed
        run: echo "LearnSphere AI deployment triggered successfully!"
